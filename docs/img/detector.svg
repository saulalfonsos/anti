<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="Medición del detector de bucles: sin detector, 9 bucles desbocados en 164 ejecuciones; con detector, 0 en 113. Gasto medio por ejecución 0,52 dólares frente a 0,33; por tarea resuelta 0,61 frente a 0,38; tareas resueltas 77 de 91 frente a 100 de 113.">
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#ECEAF4}
    .t{font-size:13px;fill:#8C8A99;letter-spacing:.06em}
    .k{font-size:15px;font-weight:600}
    .v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
    .s{font-size:12.5px;fill:#8C8A99}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  </style>
  <rect width="880" height="470" rx="16" fill="#111114"/>
  <rect x=".5" y=".5" width="879" height="469" rx="16" fill="none" stroke="#2A2833"/>

  <text x="32" y="44" class="t">MEDICIÓN · 277 EJECUCIONES DE AGY CON TAREAS REALES · GEMINI 3.8 FLASH</text>

  <rect x="32" y="64" width="12" height="12" rx="2" fill="#5A5768"/><text x="52" y="75" class="s">agy sin detector</text>
  <rect x="182" y="64" width="12" height="12" rx="2" fill="#B9A4F5"/><text x="202" y="75" class="s">agy con detector de bucles</text>

  <!-- 1. bucles desbocados -->
  <text x="32" y="122" class="k">Bucles desbocados</text>
  <text x="32" y="142" class="s">ejecuciones que no paran solas</text>
  <rect x="300" y="108" width="463" height="16" rx="3" fill="#5A5768"/><text x="775" y="121" class="v">9 de 164</text>
  <rect x="300" y="130" width="4" height="16" rx="2" fill="#B9A4F5"/><text x="314" y="143" class="v">0 de 113</text>

  <!-- 2. gasto medio por ejecución -->
  <text x="32" y="200" class="k">Gasto medio por ejecución</text>
  <text x="32" y="220" class="s">204 con coste medido · precio de API</text>
  <rect x="300" y="186" width="463" height="16" rx="3" fill="#5A5768"/><text x="775" y="199" class="v">0,52 $</text>
  <rect x="300" y="208" width="299" height="16" rx="3" fill="#B9A4F5"/><text x="611" y="221" class="v">0,33 $</text>

  <!-- 3. coste por tarea resuelta -->
  <text x="32" y="278" class="k">Coste por tarea resuelta</text>
  <text x="32" y="298" class="s">204 con coste medido · precio de API</text>
  <rect x="300" y="264" width="463" height="16" rx="3" fill="#5A5768"/><text x="775" y="277" class="v">0,61 $</text>
  <rect x="300" y="286" width="289" height="16" rx="3" fill="#B9A4F5"/><text x="601" y="299" class="v">0,38 $</text>

  <!-- 4. tareas resueltas -->
  <text x="32" y="356" class="k">Tareas resueltas</text>
  <text x="32" y="376" class="s">examen corregido</text>
  <rect x="300" y="342" width="372" height="16" rx="3" fill="#5A5768"/><text x="684" y="355" class="v">77 de 91 (85 %)</text>
  <rect x="300" y="364" width="385" height="16" rx="3" fill="#B9A4F5"/><text x="697" y="377" class="v">100 de 113 (88 %)</text>

  <line x1="32" y1="404" x2="848" y2="404" stroke="#2A2833"/>
  <text x="32" y="430" class="s">Los 9 bucles hicieron entre <tspan class="m" fill="#ECEAF4">145</tspan> y <tspan class="m" fill="#ECEAF4">261</tspan> llamadas sin editar nada y fallaron. Con detector: 10 avisos y 3 cortes</text>
  <text x="32" y="450" class="s">al llegar al tope de 120 llamadas (en uno la tarea quedó resuelta; en los otros dos, no).</text>
</svg>
